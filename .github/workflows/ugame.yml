name: Extract ApexArena

on: [push, workflow_dispatch]  # یا هر تریگری که نیاز دارید

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unrar
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Extract ApexArena.rar
        run: unrar x ApexArena.rar
        # اگر می‌خواهید فایل‌ها در پوشه‌ای خاص استخراج شوند:
        # run: unrar x ApexArena.rar /path/to/destination/
