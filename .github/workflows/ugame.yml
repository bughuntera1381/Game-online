name: Extract ApexArena
on: [push, workflow_dispatch]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unrar
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Extract ApexArena.rar
        run: unrar x ApexArena.rar

      # مرحله جدید: کامیت کردن فایل‌های استخراج‌شده
      - name: Commit extracted files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add extracted files from ApexArena.rar"
